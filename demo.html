<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Notes - Nostr Git Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 1px solid #2a2a3a;
      margin-bottom: 30px;
    }
    h1 {
      color: #a78bfa;
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }
    .tagline {
      color: #888;
      font-size: 1.1rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #1a1a2e;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 15px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.synced { background: #10b981; }
    .dot.error { background: #ef4444; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .notes-list {
      display: grid;
      gap: 15px;
      margin-bottom: 30px;
    }
    .note-card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      border: 1px solid #2a2a3a;
      transition: all 0.2s;
    }
    .note-card:hover {
      border-color: #a78bfa;
      transform: translateY(-2px);
    }
    .note-card h3 {
      margin: 0 0 8px 0;
      color: #fff;
    }
    .note-card p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .note-view {
      display: none;
      background: #1a1a2e;
      border-radius: 12px;
      padding: 30px;
      border: 1px solid #2a2a3a;
    }
    .note-view.active {
      display: block;
    }
    .back-btn {
      background: none;
      border: 1px solid #444;
      color: #888;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .back-btn:hover {
      border-color: #a78bfa;
      color: #a78bfa;
    }

    /* Markdown styles */
    .markdown h1 { color: #a78bfa; border-bottom: 1px solid #2a2a3a; padding-bottom: 10px; }
    .markdown h2 { color: #8b5cf6; margin-top: 30px; }
    .markdown h3 { color: #7c3aed; }
    .markdown p { line-height: 1.7; }
    .markdown a { color: #60a5fa; }
    .markdown code {
      background: #0f0f1a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', monospace;
      font-size: 0.9em;
    }
    .markdown pre {
      background: #0f0f1a;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .markdown pre code {
      background: none;
      padding: 0;
    }
    .markdown blockquote {
      border-left: 3px solid #a78bfa;
      margin: 20px 0;
      padding-left: 20px;
      color: #aaa;
      font-style: italic;
    }
    .markdown ul, .markdown ol {
      padding-left: 25px;
      line-height: 1.8;
    }
    .markdown li input[type="checkbox"] {
      margin-right: 8px;
    }

    .update-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #7c3aed;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      animation: slideIn 0.3s;
    }
    .update-toast.show { display: block; }
    @keyframes slideIn {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .last-updated {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }
    .last-updated .time {
      color: #10b981;
      font-weight: 500;
    }

    .footer {
      text-align: center;
      padding: 30px;
      color: #555;
      font-size: 13px;
    }
    .footer a { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Live Notes</h1>
      <p class="tagline">Git-synced notes via Nostr - updates appear automatically</p>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
      <div id="lastUpdated" class="last-updated"></div>
    </header>

    <div id="notesList" class="notes-list"></div>

    <div id="noteView" class="note-view">
      <button class="back-btn" onclick="showList()">← Back to notes</button>
      <div id="noteContent" class="markdown"></div>
    </div>

    <div class="footer">
      Powered by <a href="https://github.com/JavaScriptSolidServer/nostr-git-client">nostr-git-client</a>
      • Syncing from <a href="https://solid.social/mel/public/notes">solid.social</a>
    </div>
  </div>

  <div id="updateToast" class="update-toast">
    ✨ Notes updated!
  </div>

  <script type="importmap">
  {
    "imports": {
      "nostr-git-client": "https://esm.sh/nostr-git-client@0.0.1",
      "marked": "https://esm.sh/marked@9.0.0"
    }
  }
  </script>

  <script type="module">
    import { NostrGitClient } from 'nostr-git-client';
    import { marked } from 'marked';

    const REPO = 'https://solid.social/mel/public/notes';
    const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol'];

    let client;
    let notes = [];
    let currentNote = null;

    // Simple markdown rendering with marked
    function renderMarkdown(text) {
      return marked.parse(text);
    }

    function setStatus(state, text) {
      document.getElementById('statusDot').className = `dot ${state}`;
      document.getElementById('statusText').textContent = text;
    }

    function updateTimestamp() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.getElementById('lastUpdated').innerHTML =
        `Last synced: <span class="time">${time}</span>`;
    }

    function showToast() {
      const toast = document.getElementById('updateToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function loadNotes() {
      const files = await client.listFiles();
      notes = files.filter(f => f.name.endsWith('.md'));
      renderList();

      // If viewing a note, refresh it
      if (currentNote) {
        await showNote(currentNote);
      }
    }

    function renderList() {
      const list = document.getElementById('notesList');

      if (notes.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:#666;">No notes yet</p>';
        return;
      }

      list.innerHTML = notes.map(note => {
        const title = note.name.replace('.md', '').replace(/-/g, ' ');
        const titleCased = title.charAt(0).toUpperCase() + title.slice(1);
        return `
          <div class="note-card" onclick="window.showNote('${note.path}')">
            <h3>${titleCased}</h3>
            <p>${note.path}</p>
          </div>
        `;
      }).join('');
    }

    window.showNote = async function(path) {
      currentNote = path;
      const content = await client.readFile(path);
      document.getElementById('noteContent').innerHTML = renderMarkdown(content);
      document.getElementById('notesList').style.display = 'none';
      document.getElementById('noteView').classList.add('active');
    };

    window.showList = function() {
      currentNote = null;
      document.getElementById('notesList').style.display = 'grid';
      document.getElementById('noteView').classList.remove('active');
    };

    // Initialize
    async function init() {
      client = new NostrGitClient({
        repo: REPO,
        branch: 'main',
        relays: RELAYS
      });

      client.on('connect', () => {
        setStatus('syncing', 'Connected, syncing...');
      });

      client.on('sync', async (event) => {
        if (event.status === 'complete') {
          setStatus('synced', `Synced • ${event.commit?.slice(0, 7)}`);
          updateTimestamp();
          await loadNotes();
        } else if (event.status === 'error') {
          setStatus('error', 'Sync failed');
        }
      });

      client.on('event', async (event) => {
        if (event.type === 'repo' && event.commit !== client.currentCommit) {
          setStatus('syncing', 'Updating...');
          await client.sync(event.commit);
          showToast();
        }
      });

      // Connect and sync
      setStatus('syncing', 'Connecting...');
      client.connect();
      await client.sync();
    }

    init();
  </script>
</body>
</html>
